schema: spec-driven
context: |
  项目 open_agent，基于本地 Astron Agent 源码快照进行企业私有化改造。
  文档用中文；OpenSpec 结构标题及 SHALL/MUST 关键词保留英文。
  部署环境不访问公网，已有 Kubernetes、入口网关和 CPU 服务器。
  模型由专门团队提供内网 API。本项目只管理接口配置、凭据引用、调用和用量记录。
  不开发或部署模型网关、模型调度、推理服务、GPU 管理、模型训练或模型运维。
  用户上传 SKILL.md + 脚本/资源包；上传代码一律不可信，必须在独立沙盒中执行。
  必需能力：租户与权限、Skill 版本、多 Agent 隔离、任务并发、持久状态、日志统计、HTTP API、测试与生产、聊天调试。
  复用 React/TypeScript 控制台、Java Spring Boot 控制面、Python agent/workflow 服务和现有认证。
  现有 E2B 调用不是已验证的离线沙盒；asyncio 任务与 Redis TTL 不是持久化任务执行保障。
  新增顶层开源组件需在评估时 >=1000 GitHub stars，优先 Apache-2.0/MIT/BSD，记录版本和许可范围。
  不将 stars 门槛机械应用到每一个传递依赖；传递依赖必须单独完成 SBOM 和许可证审查。
  代码现状见 docs/platform/baseline-assessment.md；计划能力以 changes 为准，未实现前不得写为已交付。
rules:
  proposal:
    - 明确业务问题、边界、能力名称和调用链影响，排除模型基础设施。
  specs:
    - 每条需求使用 SHALL 或 MUST，场景覆盖成功、越权或失败路径。
    - 租户和环境必须由可信鉴权上下文决定；不得相信客户端传入的 tenant_id。
  design:
    - 写清调用链、数据所有权、兼容迁移、失败恢复、安全边界及未验证假设。
    - 基础设施操作使用官方 SDK；运行不可信代码时必须隔离凭据和网络。
  tasks:
    - 任务需可验证，给出具体模块和验收；未完成项保持未勾选。
    - 不以 OpenSpec 校验通过代替代码测试或真实离线集群验收。
operations:
  apply:
    guidance:
      - 先阅读当前变更及其前置依赖；逐项实现并记录验证证据。
      - 发现需求变化先更新规格，不静默增加模型基础设施或外部 SaaS 依赖。
  archive:
    guidance:
      - 只归档已完成且验收的变更，将实际交付需求同步到主规格。
