name: Platform checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the shared offline model fixture
        run: |
          python3 -m venv .contract-venv
          .contract-venv/bin/pip install fastapi==0.115.12 uvicorn==0.34.0 pydantic==2.14.1
          echo "MODEL_CONTRACT_PYTHON=$PWD/.contract-venv/bin/python" >> "$GITHUB_ENV"
      - name: Compile all console modules and exercise tenant authorization
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -f console/backend/pom.xml -pl hub -am \
            '-Dtest=TenantAccess*Test,TenantGovernanceSecurityTest,ModelSecurityTest,ModelTokenBoundPolicyTest,ModelContractTest,AgentStreamCancellationTest,SkillArchiveValidatorTest,SkillReleaseServiceTest,LegacySkillReleaseImporterTest,OutputMultipartCleanupTest,RunContractTest,RunClusterConfigurationTest,RunSupervisionConfigurationTest,PlatformRunInternalSecurityTest,ObservationExportSecurityTest,AgentRunHttpTest,RunEventStreamsTest,PlatformApplicationTest,PlatformTlsTest,HostMetricsControllerTest,OperationsMetricsTest' \
            -Dsurefire.failIfNoSpecifiedTests=false test
  mysql-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MYSQL_TEST_IMAGE: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker pull "$MYSQL_TEST_IMAGE"
      - name: Verify empty and existing databases in an isolated container
        run: python3 console/backend/tests/test_tenant_migration.py
  durable-run-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MYSQL_TEST_IMAGE: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker pull "$MYSQL_TEST_IMAGE"
      - name: Prepare the frozen dispatcher SDK and verified Temporal CLI
        run: |
          python3 -m venv .dispatch-tools
          .dispatch-tools/bin/pip install uv==0.10.9
          .dispatch-tools/bin/uv sync --directory core/agent --frozen --python 3.12
          mkdir -p .temporal-dispatch
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/temporalio/cli/releases/download/v1.10.0/temporal_cli_1.10.0_linux_amd64.tar.gz \
            -o .temporal-dispatch/cli.tar.gz
          printf '%s\n' '521f461f3d108902763bb71e85cd0fd382dc9357b59604ae03da6ae734d16890  .temporal-dispatch/cli.tar.gz' | sha256sum -c -
          tar -xzf .temporal-dispatch/cli.tar.gz -C .temporal-dispatch temporal LICENSE
          echo "OA_RUN_DISPATCH_PYTHON=$PWD/core/agent/.venv/bin/python" >> "$GITHUB_ENV"
          echo "TEMPORAL_TEST_BINARY=$PWD/.temporal-dispatch/temporal" >> "$GITHUB_ENV"
      - name: Verify Java transactions, concurrent admission and database crash recovery
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 console/backend/tests/run_durable_checks.py
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run type-check
      - run: npm run build
      - run: npm run test:workbench-session
      - run: npm run test:workbench-tokens
      - run: npm run build:workbench
  monitoring-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check alerts with the checksum-pinned official promtool
        run: |
          mkdir -p .monitor-test
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz \
            -o .monitor-test/prometheus.tar.gz
          printf '%s\n' '6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84  .monitor-test/prometheus.tar.gz' | sha256sum -c -
          tar -xzf .monitor-test/prometheus.tar.gz -C .monitor-test --strip-components=1 \
            prometheus-3.15.1.linux-amd64/promtool prometheus-3.15.1.linux-amd64/LICENSE prometheus-3.15.1.linux-amd64/NOTICE
          cd deploy/platform/monitor
          ../../../.monitor-test/promtool check rules alerts.yml
          ../../../.monitor-test/promtool test rules alerts.test.yml
  python-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: core
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned agent environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install uv==0.10.9
          .ci-venv/bin/uv sync --directory core/agent --frozen --extra cluster --python 3.12
      - name: Check both the adapter contract and existing DeepAgents behavior
        run: >-
          core/agent/.venv/bin/python -m pytest tests/model_contract
          core/agent/tests/test_base_builder.py core/agent/tests/test_llm_completion.py
          core/agent/tests/test_deepagents_harness.py -q -p no:cacheprovider
      - name: Prepare the checksum-pinned Helm CLI
        run: |
          mkdir -p .helm-test
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz -o .helm-test/helm.tar.gz
          printf '%s\n' '0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  .helm-test/helm.tar.gz' | sha256sum -c -
          tar -xzf .helm-test/helm.tar.gz -C .helm-test --strip-components=1 linux-amd64/helm linux-amd64/LICENSE
          echo "HELM_BINARY=$PWD/.helm-test/helm" >> "$GITHUB_ENV"
      - name: Check environment isolation, private image records and hardened manifests
        run: core/agent/.venv/bin/python -m pytest tests/deployment -q -p no:cacheprovider
      - name: Check private sandbox contracts and explicit legacy development gate
        run: >-
          core/agent/.venv/bin/python -m pytest core/agent/tests/test_platform_sandbox.py
          core/agent/tests/test_skill_plugin.py core/agent/tests/test_skill_sandbox_api.py
          -q -p no:cacheprovider
      - name: Prepare the checksum-pinned official Temporal test server
        run: |
          mkdir -p .temporal-test
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/temporalio/cli/releases/download/v1.10.0/temporal_cli_1.10.0_linux_amd64.tar.gz \
            -o .temporal-test/cli.tar.gz
          printf '%s\n' '521f461f3d108902763bb71e85cd0fd382dc9357b59604ae03da6ae734d16890  .temporal-test/cli.tar.gz' | sha256sum -c -
          tar -xzf .temporal-test/cli.tar.gz -C .temporal-test temporal LICENSE
      - name: Exercise durable delivery, cancellation and server restart through the official SDK
        run: |
          export TEMPORAL_TEST_BINARY="$PWD/.temporal-test/temporal"
          core/agent/.venv/bin/python -m pytest core/agent/tests/test_durable_control.py core/agent/tests/test_dispatch_environment.py \
            core/agent/tests/test_durable_workflow.py core/agent/tests/test_durable_permit.py \
            core/agent/tests/test_durable_executor.py core/agent/tests/test_durable_sandbox_journal.py core/agent/tests/test_model_budget.py \
            core/agent/tests/test_durable_supervision.py core/agent/tests/test_cluster_control.py \
            core/agent/tests/test_cluster_process.py core/agent/tests/test_cluster_child.py core/agent/tests/test_cluster_transport.py \
            core/agent/tests/test_cluster_supervisor.py core/agent/tests/test_cluster_service.py core/agent/tests/test_cluster_sandbox.py \
            core/agent/tests/test_task_outputs.py core/agent/tests/test_output_snapshot_races.py core/agent/tests/test_execution_observations.py \
            core/agent/tests/test_deepseek_reasoning.py core/agent/tests/test_observation_exporter.py tests/backup -q -p no:cacheprovider
