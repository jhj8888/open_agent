      purpose: storage
      namespace: open-agent-test-data
      podLabels: {app.kubernetes.io/name: seaweedfs, open-agent.io/environment: test}
      ports: [8333]
    - component: api
      purpose: identity
      namespace: open-agent-test-data
      podLabels: {app.kubernetes.io/name: casdoor, open-agent.io/environment: test}
      ports: [8000]
    - component: web
      purpose: identity
      namespace: open-agent-test-data
      podLabels: {app.kubernetes.io/name: casdoor, open-agent.io/environment: test}
      ports: [8000]
