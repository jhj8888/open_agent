apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oa.name" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oa.name" . }}-dns
  namespace: {{ .Release.Namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
  policyTypes: [Egress]
  egress:
    - to:
        - {{- include "oa.peer" .Values.network.dns | nindent 10 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oa.name" . }}-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/component: web
        {{- range .Values.network.apiClients }}
        - {{- include "oa.peer" . | nindent 10 }}
        {{- end }}
      ports: [{protocol: TCP, port: 18082}]
  egress:
    {{- range .Values.network.dependencies }}
    {{- if eq .component "api" }}
    - to:
        - {{- include "oa.peer" . | nindent 10 }}
      ports:
        {{- range .ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oa.name" . }}-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{- include "oa.peer" .Values.network.gateway | nindent 10 }}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/component: api
      ports: [{protocol: TCP, port: 18082}]
    {{- range .Values.network.dependencies }}
    {{- if eq .component "web" }}
    - to:
        - {{- include "oa.peer" . | nindent 10 }}
      ports:
        {{- range .ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- end }}
