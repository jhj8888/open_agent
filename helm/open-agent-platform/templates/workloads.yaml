{{- range $component := list "api" "web" }}
{{- $settings := index $.Values $component }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oa.name" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oa.name" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  {{- if not (and (eq $component "api") $.Values.api.autoscaling.enabled) }}
  replicas: {{ $settings.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "oa.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "oa.name" $ }}-{{ $component }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65531
        runAsGroup: 65531
        fsGroup: 65531
        seccompProfile: {type: RuntimeDefault}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name | quote }}
              app.kubernetes.io/component: {{ $component }}
      containers:
        - name: {{ $component }}
          image: {{ printf "%s@%s" (index $.Values.images $component).repository (index $.Values.images $component).digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - name: http
              containerPort: {{ if eq $component "api" }}18082{{ else }}8080{{ end }}
          {{- if eq $component "api" }}
          env:
            {{- range $key := list "PLATFORM_BIND_ADDRESS" "PLATFORM_PORT" "PLATFORM_OIDC_ISSUER" "PLATFORM_OIDC_JWKS" "PLATFORM_OIDC_AUDIENCE" "PLATFORM_RUN_ADMISSION_ENABLED" "MODEL_ALLOWED_ORIGINS" "MODEL_PUBLIC_DEMO_ORIGINS" "SKILL_RUNTIME_IMAGES" "PLATFORM_PROMETHEUS_URL" "LANGSMITH_TRACING" "LANGCHAIN_TRACING_V2" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef: {name: {{ include "oa.name" $ }}-config, key: {{ $key }}}
            {{- end }}
            {{- if $.Values.trustBundle.configMapName }}
            {{- range $key := list "JDK_JAVA_OPTIONS" "MODEL_CA_FILES" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef: {name: {{ include "oa.name" $ }}-config, key: {{ $key }}}
            {{- end }}
            {{- end }}
            {{- range $key := list "PLATFORM_JDBC_URL" "PLATFORM_DB_USER" "PLATFORM_DB_PASSWORD" "PLATFORM_S3_ENDPOINT" "PLATFORM_S3_BUCKET" "PLATFORM_S3_ACCESS_KEY" "PLATFORM_S3_SECRET_KEY" "MODEL_CREDENTIAL_ACTIVE_KEY" "MODEL_CREDENTIAL_KEYS" "PLATFORM_SERVICE_KEYS" "PLATFORM_RECONCILER_WORKERS" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $key }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet: {path: /health/{{ if eq $component "api" }}ready{{ else }}live{{ end }}, port: http}
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health/{{ if eq $component "api" }}ready{{ else }}live{{ end }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          resources: {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if eq $component "web" }}
            - {name: web-config, mountPath: /etc/caddy, readOnly: true}
            {{- end }}
            {{- if $.Values.trustBundle.configMapName }}
            - {name: ca, mountPath: /etc/open-agent-ca, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        {{- if eq $component "web" }}
        - name: web-config
          configMap:
            name: {{ include "oa.name" $ }}-config
            items: [{key: Caddyfile, path: Caddyfile}]
        {{- end }}
        {{- if $.Values.trustBundle.configMapName }}
        - name: ca
          configMap: {name: {{ $.Values.trustBundle.configMapName }}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oa.name" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - {name: http, port: {{ if eq $component "api" }}18082{{ else }}8080{{ end }}, targetPort: http}
{{- if $settings.disruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "oa.name" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $settings.disruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "oa.name" . }}-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "oa.name" . }}-api}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
